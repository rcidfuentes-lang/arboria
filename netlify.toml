[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Las redirecciones se resuelven en orden y la primera que casa gana. Todas las
# rutas de funcion van antes del comodin de la SPA porque, sin ellas, cualquiera
# de estas direcciones devolveria el index.html de la aplicacion.

# El endpoint de lectura del roadmap con clave Bearer. Songplay lo usa.
[[redirects]]
  from = "/api/roadmap"
  to = "/.netlify/functions/roadmap"
  status = 200

# El decisor del mismo proyecto, con la misma clave. Aparte de /api/roadmap y
# no dentro, para no moverle un byte a quien ya lee el roadmap.
[[redirects]]
  from = "/api/decisiones"
  to = "/.netlify/functions/decisiones"
  status = 200

# Servidor MCP remoto. Esta es la direccion que se anade en claude.ai.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

# Descubrimiento del recurso protegido (RFC 9728). En las dos rutas que un
# cliente puede probar: la de la raiz y la que lleva detras el camino del
# recurso, /mcp.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-recurso"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-recurso"
  status = 200

# Descubrimiento del servidor de autorizacion (RFC 8414). Igual: la ruta de la
# raiz y la variante con el camino detras.
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth-metadatos"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/oauth-metadatos"
  status = 200

# Registro dinamico de clientes y emision de tokens.
[[redirects]]
  from = "/oauth/registro"
  to = "/.netlify/functions/oauth-registro"
  status = 200

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth-token"
  status = 200

# /oauth/autorizar no aparece aqui a proposito: es una pantalla de la
# aplicacion, y la sirve el comodin de abajo como cualquier otra ruta de la SPA.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras
#
# Las de seguridad van a todo, y la que mas importa es la primera: sin ella,
# /oauth/autorizar se puede meter en un iframe, y como el registro de clientes
# es publico por especificacion, eso es una cadena entera —registrar un
# cliente, enmarcar la pantalla, conseguir un clic donde esta el boton de
# conceder— que termina en permiso de lectura sobre un roadmap.
#
# Aqui no hay Content-Security-Policy todavia. No es un olvido: hay que
# dejar pasar a Supabase y comprobar antes que el bundle de Vite no necesita
# estilos en linea. Las cuatro de abajo no rompen nada y se pueden poner hoy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los ficheros de /assets llevan el hash del contenido en el nombre: si cambia
# el fichero, cambia el nombre. Revalidarlos en cada visita es pagar un viaje
# de ida y vuelta por algo que no puede haber cambiado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
